<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            height:600px;
            border:1px solid black;
            display: flex;
        }
        .box{
            height:100%;
            width:25%;
            border:1px solid black;
        }
        img{
            width:100%;
        }
        *{
            padding:0;
            margin: 0;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <h1 align="center"> Dynamic Gallery</h1>
    <div class="container">
        <div class="box">
            <img src="c-1.png" alt="">
            <img src="c-8.png" alt="">
            <img src="c-6.png" alt="">
            <img src="c-2.png" alt="">
        </div>
        <div class="box">
           <img src="c-6.png" alt="">
            <img src="c-1.png"  alt="">
            <img src="c-2.png" alt="">
            <img src="c-8.png" alt="">
        </div>
         <div class="box">
           <img src="c-8.png"alt="">
           <img src="c-2.png" alt="">
            <img src="c-1.png" alt="">
            <img src="c-6.png"alt="">
             </div>
        <div class="box">
            <img src="c-2.png" alt="">
            <img src="c-6.png" alt="">
            <img src="c-8.png" alt="">
            <img src="c-1.png"  alt="">
        </div>
    </div>  
</body>
</html>
